name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pubg_v052_work/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pubg_v052_work
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pubg_v052_work/requirements.txt
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Run tests
        shell: pwsh
        run: |
          python -m unittest discover -p 'test_*.py'
      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PUBG_Drop_Assistant --collect-all cv2 --collect-all truststore --collect-data certifi app.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PUBG_Drop_Assistant-Windows
          path: pubg_v052_work/dist/PUBG_Drop_Assistant.exe
          if-no-files-found: error
